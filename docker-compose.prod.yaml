# Production Overrides for FeastFinder Stack
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Watchtower only updates containers carrying this label
# (WATCHTOWER_LABEL_ENABLE=true on the root stack).
#
# Applied ONLY to the 19 first-party images .github/workflows/release.yml
# publishes. Every third-party image is excluded: supabase-*, kong,
# kong-database, rabbitmq, and caddy.
x-watchtower: &watchtower-enabled
  com.centurylinklabs.watchtower.enable: "true"

services:
  # Supabase Core: Restrict DB, Auth & API Gateway host ports
  supabase-db:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:5433:5432"

  supabase-auth:
    logging: *default-logging
    ports: !reset []

  supabase-rest:
    logging: *default-logging
    ports: !reset []

  realtime-dev:
    logging: *default-logging
    ports: !reset []

  supabase-kong:
    logging: *default-logging
    ports: !reset []

  # Disable Supabase Studio & Meta in Production Mode
  supabase-studio:
    logging: *default-logging
    profiles:
      - disabled
    deploy:
      replicas: 0
    ports: !reset []

  supabase-meta:
    logging: *default-logging
    profiles:
      - disabled
    deploy:
      replicas: 0
    ports: !reset []

  # Kong Postgres DB: Restrict to localhost only
  kong-database:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:5432:5432"

  # Kong API Gateway: Zero public ports, Admin ports restricted to localhost
  kong:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"

  # RabbitMQ: Restricted internal network access only
  rabbitmq:
    logging: *default-logging
    ports: !override
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"



  rabbitmq-setup:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-rabbitmq-setup:latest

  # Microservices: Remove all host port exposure & cap log rotation
  reservation-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-reservation-service:latest
    ports: !reset []

  user-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-user-service:latest
    ports: !reset []

  notification-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-notification-service:latest
    ports: !reset []

  payment-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-payment-service:latest
    ports: !reset []

  waitlist-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-waitlist-service:latest
    ports: !reset []

  accept-reallocation-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-accept-reallocation-service:latest
    ports: !reset []

  reallocate-reservation-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-reallocate-reservation-service:latest
    ports: !reset []

  driver-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-driver-service:latest
    ports: !reset []

  driver-details-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-driver-details-service:latest
    ports: !reset []

  geo-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-geo-service:latest
    ports: !reset []

  driver-status-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-driver-status-service:latest
    ports: !reset []

  dms-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-dms-service:latest
    ports: !reset []

  create-booking-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-create-booking-service:latest
    ports: !reset []

  cancel-booking-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-cancel-booking-service:latest
    ports: !reset []

  menu-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-menu-service:latest
    ports: !reset []

  restaurant-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-restaurant-service:latest
    ports: !reset []

  order-service:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-order-service:latest
    ports: !reset []

  # Production Frontend: Caddy production container pulled from GHCR
  frontend:
    logging: *default-logging
    labels: *watchtower-enabled
    image: ghcr.io/weishenl/g4t4-is213-frontend:latest
    # Base uses Dockerfile.dev (Vite HMR). Compose MERGES build config, so without
    # an explicit override here prod would inherit Dockerfile.dev and ship the dev
    # server with no runtime env injection.
    build: !override
      context: ./frontend
      dockerfile: Dockerfile
    # Base bind-mounts host source for HMR. Must not leak into prod, or the host
    # tree would be mounted over the built static assets.
    volumes: !reset []
    ports: !reset []


  # Production Caddy Unified Gateway Edge
  # Public ports 80/443 are owned by Root Caddy
  caddy:
    logging: *default-logging
    env_file:
      - ./frontend/.env
    ports: !reset []
    networks:
      - default
      - web-gateway

networks:
  web-gateway:
    external: true


