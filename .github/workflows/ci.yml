name: CI Build Verification

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verification:
    name: Build Verification & Syntax Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Frontend Compilation
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Microservices Python Syntax
        run: |
          python -m py_compile backend/services/*/*/*.py backend/rabbitmq/*.py

      - name: Build Verification of Docker Stack
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.prod.yaml build
